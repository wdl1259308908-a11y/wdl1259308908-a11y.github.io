<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>宝宝英语乐园</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Comic Sans MS', 'Chalkboard SE', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            overflow: hidden;
            touch-action: manipulation;
        }

        .header {
            text-align: center;
            padding: 20px;
            color: white;
        }

        .header h1 {
            font-size: 36px;
            text-shadow: 3px 3px 0px rgba(0,0,0,0.2);
            letter-spacing: 2px;
        }

        .stars {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 10px;
            font-size: 32px;
        }

        .game-area {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
        }

        /* 分类标签 */
        .tabs {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }

        .tab {
            padding: 14px 28px;
            border-radius: 50px;
            border: 3px solid white;
            background: rgba(255,255,255,0.2);
            color: white;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            backdrop-filter: blur(10px);
        }

        .tab.active {
            background: white;
            color: #667eea;
            transform: scale(1.1);
        }

        .tab:active {
            transform: scale(0.9);
        }

        /* 卡片网格 */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            padding: 10px;
        }

        .card {
            background: white;
            border-radius: 24px;
            padding: 30px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 8px 32px rgba(0,0,0,0.15);
            position: relative;
            overflow: hidden;
        }

        .card::after {
            content: '🔊';
            position: absolute;
            top: 10px;
            right: 10px;
            font-size: 24px;
            opacity: 0.5;
        }

        .card:active {
            transform: scale(0.92) rotate(2deg);
        }

        .card-icon {
            font-size: 80px;
            margin-bottom: 16px;
            display: block;
            transition: transform 0.3s;
        }

        .card:hover .card-icon {
            transform: bounce 0.5s;
        }

        .card-word {
            font-size: 32px;
            font-weight: bold;
            color: #4a5568;
            margin-bottom: 8px;
        }

        .card-phonetic {
            font-size: 18px;
            color: #a0aec0;
        }

        /* 动画 */
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        @keyframes pop {
            0% { transform: scale(0); opacity: 0; }
            50% { transform: scale(1.3); }
            100% { transform: scale(1); opacity: 1; }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        .card.show {
            animation: pop 0.5s ease;
        }

        /* 奖励动画 */
        .reward {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 120px;
            pointer-events: none;
            z-index: 1000;
            animation: rewardPop 1s ease forwards;
        }

        @keyframes rewardPop {
            0% { transform: translate(-50%, -50%) scale(0) rotate(0deg); }
            50% { transform: translate(-50%, -50%) scale(1.5) rotate(180deg); }
            100% { transform: translate(-50%, -50%) scale(1) rotate(360deg); opacity: 0; }
        }

        /* 底部控制 */
        .controls {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: white;
            padding: 20px;
            display: flex;
            justify-content: space-around;
            box-shadow: 0 -4px 20px rgba(0,0,0,0.1);
            border-radius: 30px 30px 0 0;
        }

        .control-btn {
            background: none;
            border: none;
            font-size: 40px;
            cursor: pointer;
            transition: transform 0.2s;
            padding: 10px;
        }

        .control-btn:active {
            transform: scale(0.8);
        }

        .control-btn span {
            display: block;
            font-size: 14px;
            color: #666;
            margin-top: 4px;
        }

        /* 游戏模式覆盖层 */
        .game-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.85);
            z-index: 999;
            display: none;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            color: white;
        }

        .game-overlay.active {
            display: flex;
        }

        .game-question {
            font-size: 48px;
            margin-bottom: 40px;
        }

        .game-options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            max-width: 500px;
            width: 90%;
        }

        .game-option {
            background: white;
            border: none;
            border-radius: 20px;
            padding: 30px;
            font-size: 60px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .game-option:active {
            transform: scale(0.9);
        }

        .game-option.correct {
            background: #48bb78;
            animation: bounce 0.5s;
        }

        .game-option.wrong {
            background: #f56565;
            animation: shake 0.5s;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-20px); }
            75% { transform: translateX(20px); }
        }

        .score-board {
            position: fixed;
            top: 20px;
            right: 20px;
            background: white;
            padding: 15px 25px;
            border-radius: 20px;
            font-size: 24px;
            font-weight: bold;
            color: #667eea;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>

<div class="score-board">⭐ <span id="score">0</span></div>

<div class="header">
    <h1>🌈 宝宝英语乐园</h1>
    <div class="stars">⭐ ⭐ ⭐ ⭐ ⭐</div>
</div>

<div class="game-area">
    <div class="tabs">
        <button class="tab active" onclick="switchTab('animals')">🐾 动物</button>
        <button class="tab" onclick="switchTab('food')">🍎 食物</button>
        <button class="tab" onclick="switchTab('colors')">🎨 颜色</button>
        <button class="tab" onclick="switchTab('body')">👋 身体</button>
        <button class="tab" onclick="switchTab('numbers')">🔢 数字</button>
    </div>

    <div class="cards-grid" id="cardsContainer">
        <!-- 动态生成 -->
    </div>
</div>

<!-- 游戏模式弹窗 -->
<div class="game-overlay" id="gameOverlay">
    <div class="game-question" id="gameQuestion">哪个是 Cat？</div>
    <div class="game-options" id="gameOptions"></div>
    <button class="tab" style="margin-top: 30px;" onclick="closeGame()">返回学习</button>
</div>

<!-- 底部控制 -->
<div class="controls">
    <button class="control-btn" onclick="startGame()">
        🎮
        <span>游戏</span>
    </button>
    <button class="control-btn" onclick="speakAll()">
        🔊
        <span>跟读</span>
    </button>
    <button class="control-btn" onclick="shuffleCards()">
        🔄
        <span>换一批</span>
    </button>
    <button class="control-btn" onclick="toggleMusic()">
        🎵
        <span>音乐</span>
    </button>
</div>

<script>
    // 幼儿词汇库（图标 + 单词 + 发音）
    const vocabulary = {
        animals: [
            { icon: '🐱', word: 'Cat', phonetic: '/kæt/', cn: '小猫' },
            { icon: '🐶', word: 'Dog', phonetic: '/dɒɡ/', cn: '小狗' },
            { icon: '🐘', word: 'Elephant', phonetic: '/ˈelɪfənt/', cn: '大象' },
            { icon: '🦁', word: 'Lion', phonetic: '/ˈlaɪən/', cn: '狮子' },
            { icon: '🐰', word: 'Rabbit', phonetic: '/ˈræbɪt/', cn: '兔子' },
            { icon: '🐼', word: 'Panda', phonetic: '/ˈpændə/', cn: '熊猫' }
        ],
        food: [
            { icon: '🍎', word: 'Apple', phonetic: '/ˈæpl/', cn: '苹果' },
            { icon: '🍌', word: 'Banana', phonetic: '/bəˈnɑːnə/', cn: '香蕉' },
            { icon: '🍊', word: 'Orange', phonetic: '/ˈɒrɪndʒ/', cn: '橙子' },
            { icon: '🥛', word: 'Milk', phonetic: '/mɪlk/', cn: '牛奶' },
            { icon: '🍞', word: 'Bread', phonetic: '/bred/', cn: '面包' },
            { icon: '🍰', word: 'Cake', phonetic: '/keɪk/', cn: '蛋糕' }
        ],
        colors: [
            { icon: '🔴', word: 'Red', phonetic: '/red/', cn: '红色' },
            { icon: '🔵', word: 'Blue', phonetic: '/bluː/', cn: '蓝色' },
            { icon: '🟡', word: 'Yellow', phonetic: '/ˈjeləʊ/', cn: '黄色' },
            { icon: '🟢', word: 'Green', phonetic: '/ɡriːn/', cn: '绿色' },
            { icon: '🟣', word: 'Purple', phonetic: '/ˈpɜːpl/', cn: '紫色' },
            { icon: '🟠', word: 'Orange', phonetic: '/ˈɒrɪndʒ/', cn: '橙色' }
        ],
        body: [
            { icon: '👁️', word: 'Eye', phonetic: '/aɪ/', cn: '眼睛' },
            { icon: '👂', word: 'Ear', phonetic: '/ɪə/', cn: '耳朵' },
            { icon: '👃', word: 'Nose', phonetic: '/nəʊz/', cn: '鼻子' },
            { icon: '👄', word: 'Mouth', phonetic: '/maʊθ/', cn: '嘴巴' },
            { icon: '👋', word: 'Hand', phonetic: '/hænd/', cn: '手' },
            { icon: '🦶', word: 'Foot', phonetic: '/fʊt/', cn: '脚' }
        ],
        numbers: [
            { icon: '1️⃣', word: 'One', phonetic: '/wʌn/', cn: '一' },
            { icon: '2️⃣', word: 'Two', phonetic: '/tuː/', cn: '二' },
            { icon: '3️⃣', word: 'Three', phonetic: '/θriː/', cn: '三' },
            { icon: '4️⃣', word: 'Four', phonetic: '/fɔː/', cn: '四' },
            { icon: '5️⃣', word: 'Five', phonetic: '/faɪv/', cn: '五' },
            { icon: '🔟', word: 'Ten', phonetic: '/ten/', cn: '十' }
        ]
    };

    let currentTab = 'animals';
    let score = parseInt(localStorage.getItem('babyScore') || '0');
    let isMusicOn = false;
    let currentCards = [];

    // 更新分数显示
    document.getElementById('score').textContent = score;

    function switchTab(tab) {
        currentTab = tab;
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        event.target.classList.add('active');
        renderCards();
    }

    function renderCards() {
        const container = document.getElementById('cardsContainer');
        container.innerHTML = '';
        currentCards = vocabulary[currentTab];
        
        currentCards.forEach((item, index) => {
            const card = document.createElement('div');
            card.className = 'card show';
            card.style.animationDelay = `${index * 0.1}s`;
            card.innerHTML = `
                <span class="card-icon">${item.icon}</span>
                <div class="card-word">${item.word}</div>
                <div class="card-phonetic">${item.cn}</div>
            `;
            card.onclick = () => speakWord(item);
            container.appendChild(card);
        });
    }

    function speakWord(item) {
        // 播放英文
        const utterance = new SpeechSynthesisUtterance(item.word);
        utterance.lang = 'en-US';
        utterance.rate = 0.7;
        utterance.pitch = 1.2; // 更高音调，更亲切
        speechSynthesis.speak(utterance);

        // 延迟播放中文
        setTimeout(() => {
            const cn = new SpeechSynthesisUtterance(item.cn);
            cn.lang = 'zh-CN';
            cn.rate = 0.8;
            speechSynthesis.speak(cn);
        }, 800);

        // 奖励动画
        showReward(item.icon);
        
        // 加分
        score += 1;
        localStorage.setItem('babyScore', score);
        document.getElementById('score').textContent = score;
    }

    function showReward(emoji) {
        const reward = document.createElement('div');
        reward.className = 'reward';
        reward.textContent = emoji;
        document.body.appendChild(reward);
        setTimeout(() => reward.remove(), 1000);
    }

    // 游戏模式：听音选图
    function startGame() {
        const items = vocabulary[currentTab];
        const correct = items[Math.floor(Math.random() * items.length)];
        const options = [correct];
        
        // 随机选3个错误选项
        while (options.length < 4) {
            const random = items[Math.floor(Math.random() * items.length)];
            if (!options.includes(random)) options.push(random);
        }
        
        // 打乱顺序
        options.sort(() => Math.random() - 0.5);
        
        document.getElementById('gameQuestion').textContent = `哪个是 ${correct.word}？`;
        const optsContainer = document.getElementById('gameOptions');
        optsContainer.innerHTML = '';
        
        options.forEach(opt => {
            const btn = document.createElement('button');
            btn.className = 'game-option';
            btn.textContent = opt.icon;
            btn.onclick = () => checkAnswer(btn, opt, correct);
            optsContainer.appendChild(btn);
        });
        
        document.getElementById('gameOverlay').classList.add('active');
        
        // 播放问题
        setTimeout(() => {
            const q = new SpeechSynthesisUtterance(`Which one is ${correct.word}?`);
            q.lang = 'en-US';
            q.rate = 0.7;
            speechSynthesis.speak(q);
        }, 300);
    }

    function checkAnswer(btn, selected, correct) {
        if (selected.word === correct.word) {
            btn.classList.add('correct');
            score += 5;
            localStorage.setItem('babyScore', score);
            document.getElementById('score').textContent = score;
            showReward('🎉');
            
            // 播放鼓励
            const praise = ['Great job!', 'Well done!', 'Amazing!', 'Perfect!'];
            const p = new SpeechSynthesisUtterance(praise[Math.floor(Math.random() * praise.length)]);
            p.lang = 'en-US';
            p.pitch = 1.5;
            speechSynthesis.speak(p);
            
            setTimeout(() => {
                closeGame();
                startGame(); // 自动下一题
            }, 1500);
        } else {
            btn.classList.add('wrong');
            // 震动反馈（如果设备支持）
            if (navigator.vibrate) navigator.vibrate(200);
        }
    }

    function closeGame() {
        document.getElementById('gameOverlay').classList.remove('active');
    }

    function speakAll() {
        currentCards.forEach((item, index) => {
            setTimeout(() => speakWord(item), index * 2000);
        });
    }

    function shuffleCards() {
        const container = document.getElementById('cardsContainer');
        const cards = Array.from(container.children);
        cards.sort(() => Math.random() - 0.5);
        cards.forEach(card => container.appendChild(card));
    }

    function toggleMusic() {
        isMusicOn = !isMusicOn;
        if (isMusicOn) {
            // 播放简单旋律（使用 Web Audio API）
            playSimpleMelody();
        }
    }

    function playSimpleMelody() {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const notes = [261.63, 293.66, 329.63, 349.23, 392.00, 440.00, 493.88, 523.25];
        
        notes.forEach((freq, i) => {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.frequency.value = freq;
            osc.type = 'sine';
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime + i * 0.3);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + i * 0.3 + 0.2);
            osc.start(audioCtx.currentTime + i * 0.3);
            osc.stop(audioCtx.currentTime + i * 0.3 + 0.2);
        });
    }

    // 触摸滑动切换分类
    let touchStartX = 0;
    const tabs = ['animals', 'food', 'colors', 'body', 'numbers'];
    
    document.addEventListener('touchstart', e => touchStartX = e.touches[0].clientX);
    document.addEventListener('touchend', e => {
        const diff = touchStartX - e.changedTouches[0].clientX;
        if (Math.abs(diff) > 80) {
            const currentIdx = tabs.indexOf(currentTab);
            const newIdx = diff > 0 
                ? (currentIdx + 1) % tabs.length 
                : (currentIdx - 1 + tabs.length) % tabs.length;
            currentTab = tabs[newIdx];
            document.querySelectorAll('.tab').forEach((t, i) => {
                t.classList.toggle('active', i === newIdx);
            });
            renderCards();
        }
    });

    // 初始化
    renderCards();
</script>

</body>
</html>
