<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>宝宝英语乐园</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Comic Sans MS', 'Chalkboard SE', 'Arial Rounded MT Bold', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            overflow-x: hidden;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }

        .header {
            text-align: center;
            padding: 20px 10px 10px;
            color: white;
        }

        .header h1 {
            font-size: 32px;
            text-shadow: 3px 3px 0px rgba(0,0,0,0.2);
            letter-spacing: 2px;
        }

        .stars {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-top: 8px;
            font-size: 28px;
        }

        .game-area {
            max-width: 900px;
            margin: 0 auto;
            padding: 10px 15px 120px;
        }

        .tabs {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .tab {
            padding: 12px 22px;
            border-radius: 50px;
            border: 3px solid white;
            background: rgba(255,255,255,0.2);
            color: white;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            backdrop-filter: blur(10px);
            -webkit-appearance: none;
        }

        .tab.active {
            background: white;
            color: #667eea;
            transform: scale(1.08);
        }

        .tab:active {
            transform: scale(0.92);
        }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 15px;
            padding: 5px;
        }

        @media (min-width: 768px) {
            .cards-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        .card {
            background: white;
            border-radius: 24px;
            padding: 25px 15px;
            text-align: center;
            cursor: pointer;
            transition: all 0.25s;
            box-shadow: 0 8px 32px rgba(0,0,0,0.15);
            position: relative;
            overflow: hidden;
            -webkit-user-select: none;
            user-select: none;
        }

        .card::after {
            content: '🔊';
            position: absolute;
            top: 10px;
            right: 10px;
            font-size: 20px;
            opacity: 0.4;
        }

        .card:active {
            transform: scale(0.92) rotate(1deg);
        }

        .card-icon {
            font-size: 70px;
            margin-bottom: 12px;
            display: block;
            line-height: 1;
        }

        .card-word {
            font-size: 28px;
            font-weight: bold;
            color: #2d3748;
            margin-bottom: 6px;
        }

        .card-phonetic {
            font-size: 16px;
            color: #a0aec0;
        }

        @keyframes popIn {
            0% { transform: scale(0.5); opacity: 0; }
            60% { transform: scale(1.05); }
            100% { transform: scale(1); opacity: 1; }
        }

        .card.show {
            animation: popIn 0.4s ease;
        }

        .card.speaking {
            box-shadow: 0 0 30px rgba(79, 70, 229, 0.6);
            transform: scale(1.05);
        }

        .reward {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 100px;
            pointer-events: none;
            z-index: 1000;
            animation: rewardPop 0.8s ease forwards;
        }

        @keyframes rewardPop {
            0% { transform: translate(-50%, -50%) scale(0) rotate(0deg); opacity: 1; }
            50% { transform: translate(-50%, -50%) scale(1.3) rotate(180deg); }
            100% { transform: translate(-50%, -50%) scale(1) rotate(360deg); opacity: 0; }
        }

        .controls {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: white;
            padding: 15px 20px 25px;
            display: flex;
            justify-content: space-around;
            box-shadow: 0 -4px 20px rgba(0,0,0,0.1);
            border-radius: 25px 25px 0 0;
            z-index: 100;
        }

        .control-btn {
            background: none;
            border: none;
            font-size: 36px;
            cursor: pointer;
            transition: transform 0.2s;
            padding: 8px;
            -webkit-appearance: none;
        }

        .control-btn:active {
            transform: scale(0.85);
        }

        .control-btn span {
            display: block;
            font-size: 12px;
            color: #666;
            margin-top: 2px;
            font-family: sans-serif;
        }

        .game-overlay {
            position: fixed;
            top: 0; 
            left: 0; 
            right: 0; 
            bottom: 0;
            background: rgba(0,0,0,0.88);
            z-index: 999;
            display: none;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            color: white;
            padding: 20px;
        }

        .game-overlay.active {
            display: flex;
        }

        .game-question {
            font-size: 36px;
            margin-bottom: 30px;
            text-align: center;
        }

        .game-options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            max-width: 450px;
            width: 100%;
        }

        .game-option {
            background: white;
            border: none;
            border-radius: 20px;
            padding: 25px;
            font-size: 55px;
            cursor: pointer;
            transition: all 0.2s;
            -webkit-appearance: none;
        }

        .game-option:active {
            transform: scale(0.92);
        }

        .game-option.correct {
            background: #48bb78;
            animation: bounce 0.5s;
        }

        .game-option.wrong {
            background: #f56565;
            animation: shake 0.5s;
        }

        @keyframes bounce {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-15px); }
            75% { transform: translateX(15px); }
        }

        .score-board {
            position: fixed;
            top: 15px;
            right: 15px;
            background: white;
            padding: 12px 20px;
            border-radius: 18px;
            font-size: 20px;
            font-weight: bold;
            color: #667eea;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            z-index: 50;
        }

        .hint-text {
            text-align: center;
            color: rgba(255,255,255,0.7);
            font-size: 14px;
            margin-bottom: 10px;
        }

        /* 调试面板 */
        .debug-panel {
            position: fixed;
            bottom: 100px;
            left: 10px;
            right: 10px;
            background: rgba(0,0,0,0.85);
            color: #0f0;
            padding: 10px;
            border-radius: 10px;
            font-size: 12px;
            font-family: monospace;
            max-height: 150px;
            overflow-y: auto;
            z-index: 200;
            display: none;
        }

        .debug-panel.active {
            display: block;
        }

        .debug-toggle {
            position: fixed;
            bottom: 100px;
            right: 10px;
            background: rgba(0,0,0,0.6);
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 20px;
            font-size: 12px;
            z-index: 201;
        }
    </style>
</head>
<body>

<div class="score-board">⭐ <span id="score">0</span></div>

<div class="header">
    <h1>🌈 宝宝英语乐园</h1>
    <div class="stars">⭐ ⭐ ⭐ ⭐ ⭐</div>
</div>

<div class="game-area">
    <div class="hint-text">👇 点击卡片听发音，左右滑动换分类</div>
    
    <div class="tabs">
        <button class="tab active" onclick="switchTab('animals', this)">🐾 动物</button>
        <button class="tab" onclick="switchTab('food', this)">🍎 食物</button>
        <button class="tab" onclick="switchTab('colors', this)">🎨 颜色</button>
        <button class="tab" onclick="switchTab('body', this)">👋 身体</button>
        <button class="tab" onclick="switchTab('numbers', this)">🔢 数字</button>
    </div>

    <div class="cards-grid" id="cardsContainer"></div>
</div>

<div class="game-overlay" id="gameOverlay">
    <div class="game-question" id="gameQuestion">哪个是 Cat？</div>
    <div class="game-options" id="gameOptions"></div>
    <button class="tab" style="margin-top: 25px;" onclick="closeGame()">🏠 返回学习</button>
</div>

<div class="controls">
    <button class="control-btn" onclick="startGame()">
        🎮<<span>游戏</span>
    </button>
    <button class="control-btn" onclick="speakAll()">
        🔊<<span>跟读</span>
    </button>
    <button class="control-btn" onclick="shuffleCards()">
        🔄<<span>换一批</span>
    </button>
    <button class="control-btn" onclick="toggleMusic()">
        🎵<<span>音乐</span>
    </button>
</div>

<!-- 调试面板 -->
<button class="debug-toggle" onclick="toggleDebug()">🔧 调试</button>
<div class="debug-panel" id="debugPanel"></div>

<script>
    // ===== 调试日志 =====
    var debugLogs = [];
    function log(msg) {
        var time = new Date().toLocaleTimeString();
        var line = '[' + time + '] ' + msg;
        debugLogs.push(line);
        console.log(line);
        
        var panel = document.getElementById('debugPanel');
        if (panel) {
            panel.innerHTML = debugLogs.join('<br>');
            panel.scrollTop = panel.scrollHeight;
        }
    }
    
    function toggleDebug() {
        var panel = document.getElementById('debugPanel');
        panel.classList.toggle('active');
    }

    // ===== 全局状态 =====
    var audioUnlocked = false;
    var voicesLoaded = false;
    var currentTab = 'animals';
    var score = 0;
    var isMusicOn = false;
    var isSpeakingAll = false;
    var currentCards = [];
    var tabNames = ['animals', 'food', 'colors', 'body', 'numbers'];
    
    // ===== 词汇数据库 =====
    var vocabulary = {
        animals: [
            { icon: '🐱', word: 'Cat', cn: '小猫' },
            { icon: '🐶', word: 'Dog', cn: '小狗' },
            { icon: '🐘', word: 'Elephant', cn: '大象' },
            { icon: '🦁', word: 'Lion', cn: '狮子' },
            { icon: '🐰', word: 'Rabbit', cn: '兔子' },
            { icon: '🐼', word: 'Panda', cn: '熊猫' }
        ],
        food: [
            { icon: '🍎', word: 'Apple', cn: '苹果' },
            { icon: '🍌', word: 'Banana', cn: '香蕉' },
            { icon: '🍊', word: 'Orange', cn: '橙子' },
            { icon: '🥛', word: 'Milk', cn: '牛奶' },
            { icon: '🍞', word: 'Bread', cn: '面包' },
            { icon: '🍰', word: 'Cake', cn: '蛋糕' }
        ],
        colors: [
            { icon: '🔴', word: 'Red', cn: '红色' },
            { icon: '🔵', word: 'Blue', cn: '蓝色' },
            { icon: '🟡', word: 'Yellow', cn: '黄色' },
            { icon: '🟢', word: 'Green', cn: '绿色' },
            { icon: '🟣', word: 'Purple', cn: '紫色' },
            { icon: '🟠', word: 'Orange', cn: '橙色' }
        ],
        body: [
            { icon: '👁️', word: 'Eye', cn: '眼睛' },
            { icon: '👂', word: 'Ear', cn: '耳朵' },
            { icon: '👃', word: 'Nose', cn: '鼻子' },
            { icon: '👄', word: 'Mouth', cn: '嘴巴' },
            { icon: '👋', word: 'Hand', cn: '手' },
            { icon: '🦶', word: 'Foot', cn: '脚' }
        ],
        numbers: [
            { icon: '1️⃣', word: 'One', cn: '一' },
            { icon: '2️⃣', word: 'Two', cn: '二' },
            { icon: '3️⃣', word: 'Three', cn: '三' },
            { icon: '4️⃣', word: 'Four', cn: '四' },
            { icon: '5️⃣', word: 'Five', cn: '五' },
            { icon: '🔟', word: 'Ten', cn: '十' }
        ]
    };

    // ===== 初始化分数 =====
    try {
        score = parseInt(localStorage.getItem('babyScore') || '0');
    } catch (e) {
        score = 0;
    }

    // ===== 检测语音支持 =====
    function checkSpeechSupport() {
        if (!window.speechSynthesis) {
            log('❌ 浏览器不支持 speechSynthesis');
            return false;
        }
        
        var voices = speechSynthesis.getVoices();
        log('🎤 语音支持检测: ' + (voices ? voices.length : 0) + ' 个语音');
        
        if (voices && voices.length > 0) {
            for (var i = 0; i < Math.min(3, voices.length); i++) {
                log('  - ' + voices[i].name + ' (' + voices[i].lang + ')');
            }
        }
        
        return true;
    }

    // ===== 解锁音频（安卓简化版）=====
    function unlockAudio() {
        if (audioUnlocked) return true;
        
        log('🔓 尝试解锁音频...');
        
        try {
            // 安卓：只需要解锁 speechSynthesis，不需要 AudioContext
            if (window.speechSynthesis) {
                // 安卓关键：直接 speak 一个内容，不要 cancel
                var testUtter = new SpeechSynthesisUtterance('hello');
                testUtter.volume = 1;
                testUtter.rate = 1.5;
                testUtter.pitch = 1;
                
                testUtter.onstart = function() {
                    log('✅ 语音测试成功');
                };
                
                testUtter.onerror = function(e) {
                    log('❌ 语音测试失败: ' + e.error);
                };
                
                speechSynthesis.speak(testUtter);
            }
            
            audioUnlocked = true;
            log('🔓 音频已解锁');
            return true;
        } catch (e) {
            log('❌ 解锁异常: ' + e.message);
            return false;
        }
    }

    // ===== 核心：播放单词（安卓优化版）=====
    function speakWord(item, skipReward) {
        log('🎯 点击: ' + item.word);
        
        // 解锁（首次需要）
        if (!audioUnlocked) {
            unlockAudio();
        }
        
        if (!window.speechSynthesis) {
            log('❌ speechSynthesis 不可用');
            return;
        }
        
        // 安卓关键：不要 cancel！直接 speak
        // speechSynthesis.cancel(); // ← 删除这行！
        
        // 播放英文
        function playEnglish() {
            try {
                log('🔊 播放英文: ' + item.word);
                
                var utterance = new SpeechSynthesisUtterance(item.word);
                utterance.lang = 'en-US';
                utterance.rate = 0.7;
                utterance.pitch = 1.2;
                utterance.volume = 1;
                
                utterance.onstart = function() {
                    log('▶️ 英文开始');
                };
                
                utterance.onend = function() {
                    log('⏹️ 英文结束');
                    // 英文结束后播放中文
                    setTimeout(playChinese, 300);
                };
                
                utterance.onerror = function(e) {
                    log('❌ 英文错误: ' + e.error);
                    // 错误也尝试中文
                    setTimeout(playChinese, 300);
                };
                
                speechSynthesis.speak(utterance);
            } catch (e) {
                log('❌ 英文异常: ' + e.message);
                setTimeout(playChinese, 300);
            }
        }
        
        // 播放中文（独立函数，失败不影响英文）
        function playChinese() {
            try {
                log('🔊 播放中文: ' + item.cn);
                
                var cn = new SpeechSynthesisUtterance(item.cn);
                cn.lang = 'zh-CN';
                cn.rate = 0.8;
                cn.volume = 1;
                
                cn.onstart = function() {
                    log('▶️ 中文开始');
                };
                
                cn.onend = function() {
                    log('⏹️ 中文结束');
                };
                
                cn.onerror = function(e) {
                    log('❌ 中文错误: ' + e.error);
                };
                
                speechSynthesis.speak(cn);
            } catch (e) {
                log('❌ 中文异常: ' + e.message);
            }
        }
        
        // 开始播放
        playEnglish();

        // 奖励动画
        if (!skipReward) {
            showReward(item.icon);
            
            score += 1;
            try {
                localStorage.setItem('babyScore', score);
            } catch (e) {}
            
            var scoreEl = document.getElementById('score');
            if (scoreEl) scoreEl.textContent = score;
        }
    }

    // ===== 显示奖励动画 =====
    function showReward(emoji) {
        var oldRewards = document.querySelectorAll('.reward');
        for (var i = 0; i < oldRewards.length; i++) {
            if (oldRewards[i].parentNode) {
                oldRewards[i].parentNode.removeChild(oldRewards[i]);
            }
        }
        
        var reward = document.createElement('div');
        reward.className = 'reward';
        reward.textContent = emoji;
        document.body.appendChild(reward);
        
        setTimeout(function() {
            if (reward.parentNode) {
                reward.parentNode.removeChild(reward);
            }
        }, 800);
    }

    // ===== 切换分类 =====
    function switchTab(tab, btnElement) {
        currentTab = tab;
        
        var allTabs = document.querySelectorAll('.tab');
        for (var i = 0; i < allTabs.length; i++) {
            allTabs[i].classList.remove('active');
        }
        
        if (btnElement) {
            btnElement.classList.add('active');
        } else {
            var idx = tabNames.indexOf(tab);
            if (allTabs[idx]) allTabs[idx].classList.add('active');
        }
        
        renderCards();
    }

    // ===== 渲染卡片 =====
    function renderCards() {
        var container = document.getElementById('cardsContainer');
        if (!container) return;
        
        container.innerHTML = '';
        currentCards = vocabulary[currentTab] || [];
        
        for (var i = 0; i < currentCards.length; i++) {
            var item = currentCards[i];
            var card = document.createElement('div');
            card.className = 'card show';
            card.style.animationDelay = (i * 0.08) + 's';
            card.innerHTML = 
                '<span class="card-icon">' + item.icon + '</span>' +
                '<div class="card-word">' + item.word + '</div>' +
                '<div class="card-phonetic">' + item.cn + '</div>';
            
            // 绑定点击
            card.addEventListener('click', (function(currentItem) {
                return function() {
                    speakWord(currentItem);
                };
            })(item));
            
            container.appendChild(card);
        }
    }

    // ===== 跟读模式 =====
    function speakAll() {
        if (isSpeakingAll) {
            log('⚠️ 跟读正在进行中');
            return;
        }
        
        if (!currentCards || currentCards.length === 0) {
            log('⚠️ 没有卡片');
            return;
        }
        
        isSpeakingAll = true;
        log('🎵 开始跟读模式');
        
        if (!audioUnlocked) {
            unlockAudio();
        }
        
        // 安卓：不要 cancel
        // speechSynthesis.cancel();
        
        var index = 0;
        
        function speakNext() {
            if (!isSpeakingAll) {
                log('⏹️ 跟读已停止');
                clearAllHighlight();
                return;
            }
            
            if (index >= currentCards.length) {
                log('✅ 跟读完成');
                isSpeakingAll = false;
                clearAllHighlight();
                return;
            }
            
            var item = currentCards[index];
            
            // 高亮当前
            clearAllHighlight();
            var allCards = document.querySelectorAll('.card');
            if (allCards[index]) {
                allCards[index].classList.add('speaking');
                allCards[index].scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
            
            // 播放
            speakWord(item, true);
            
            index++;
            setTimeout(speakNext, 2500);
        }
        
        function clearAllHighlight() {
            var allCards = document.querySelectorAll('.card');
            for (var i = 0; i < allCards.length; i++) {
                allCards[i].classList.remove('speaking');
            }
        }
        
        speakNext();
    }

    // ===== 打乱卡片 =====
    function shuffleCards() {
        var container = document.getElementById('cardsContainer');
        if (!container) return;
        
        var cards = Array.from(container.children);
        cards.sort(function() { return Math.random() - 0.5; });
        
        for (var i = 0; i < cards.length; i++) {
            container.appendChild(cards[i]);
        }
    }

    // ===== 游戏模式 =====
    function startGame() {
        if (!audioUnlocked) unlockAudio();
        
        var items = vocabulary[currentTab];
        if (!items || items.length === 0) return;
        
        var correctIndex = Math.floor(Math.random() * items.length);
        var correct = items[correctIndex];
        
        var options = [correct];
        var usedIndices = [correctIndex];
        
        while (options.length < 4 && options.length < items.length) {
            var randomIdx = Math.floor(Math.random() * items.length);
            if (usedIndices.indexOf(randomIdx) === -1) {
                usedIndices.push(randomIdx);
                options.push(items[randomIdx]);
            }
        }
        
        options.sort(function() { return Math.random() - 0.5; });
        
        var questionEl = document.getElementById('gameQuestion');
        if (questionEl) questionEl.textContent = '哪个是 ' + correct.word + '？';
        
        var optsContainer = document.getElementById('gameOptions');
        if (!optsContainer) return;
        optsContainer.innerHTML = '';
        
        for (var j = 0; j < options.length; j++) {
            var opt = options[j];
            var btn = document.createElement('button');
            btn.className = 'game-option';
            btn.textContent = opt.icon;
            
            btn.addEventListener('click', (function(currentOpt, currentBtn) {
                return function() {
                    checkAnswer(currentBtn, currentOpt, correct);
                };
            })(opt, btn));
            
            optsContainer.appendChild(btn);
        }
        
        var overlay = document.getElementById('gameOverlay');
        if (overlay) overlay.classList.add('active');
        
        setTimeout(function() {
            if (!audioUnlocked) unlockAudio();
            try {
                var q = new SpeechSynthesisUtterance('Which one is ' + correct.word + '?');
                q.lang = 'en-US';
                q.rate = 0.7;
                speechSynthesis.speak(q);
            } catch (e) {}
        }, 600);
    }

    function checkAnswer(btn, selected, correct) {
        if (selected.word === correct.word) {
            btn.classList.add('correct');
            score += 5;
            try {
                localStorage.setItem('babyScore', score);
            } catch (e) {}
            
            var scoreEl = document.getElementById('score');
            if (scoreEl) scoreEl.textContent = score;
            
            showReward('🎉');
            
            try {
                var praises = ['Great job!', 'Well done!', 'Amazing!', 'Perfect!'];
                var p = new SpeechSynthesisUtterance(praises[Math.floor(Math.random() * praises.length)]);
                p.lang = 'en-US';
                p.pitch = 1.5;
                p.rate = 0.8;
                speechSynthesis.speak(p);
            } catch (e) {}
            
            setTimeout(function() {
                closeGame();
                startGame();
            }, 1600);
        } else {
            btn.classList.add('wrong');
            if (navigator.vibrate) {
                navigator.vibrate(200);
            }
            try {
                var wrong = new SpeechSynthesisUtterance('Try again');
                wrong.lang = 'en-US';
                wrong.rate = 0.8;
                speechSynthesis.speak(wrong);
            } catch (e) {}
        }
    }

    function closeGame() {
        var overlay = document.getElementById('gameOverlay');
        if (overlay) overlay.classList.remove('active');
    }

    // ===== 音乐 =====
    function toggleMusic() {
        isMusicOn = !isMusicOn;
        if (isMusicOn) {
            playSimpleMelody();
        }
    }

    function playSimpleMelody() {
        try {
            var audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            
            var notes = [261.63, 293.66, 329.63, 349.23, 392.00, 440.00, 493.88, 523.25];
            for (var n = 0; n < notes.length; n++) {
                (function(freq, i) {
                    var osc = audioCtx.createOscillator();
                    var gain = audioCtx.createGain();
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.frequency.value = freq;
                    osc.type = 'sine';
                    gain.gain.setValueAtTime(0.08, audioCtx.currentTime + i * 0.25);
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + i * 0.25 + 0.2);
                    osc.start(audioCtx.currentTime + i * 0.25);
                    osc.stop(audioCtx.currentTime + i * 0.25 + 0.2);
                })(notes[n], n);
            }
        } catch (e) {
            log('音乐失败: ' + e.message);
        }
    }

    // ===== 触摸滑动 =====
    var touchStartX = 0;
    var touchStartY = 0;
    
    document.addEventListener('touchstart', function(e) {
        touchStartX = e.touches[0].clientX;
        touchStartY = e.touches[0].clientY;
    });
    
    document.addEventListener('touchend', function(e) {
        var diffX = touchStartX - e.changedTouches[0].clientX;
        var diffY = touchStartY - e.changedTouches[0].clientY;
        
        if (Math.abs(diffX) > 60 && Math.abs(diffY) < 100) {
            var currentIdx = tabNames.indexOf(currentTab);
            var newIdx;
            
            if (diffX > 0) {
                newIdx = (currentIdx + 1) % tabNames.length;
            } else {
                newIdx = (currentIdx - 1 + tabNames.length) % tabNames.length;
            }
            
            currentTab = tabNames[newIdx];
            var allTabs = document.querySelectorAll('.tab');
            for (var t = 0; t < allTabs.length; t++) {
                allTabs[t].classList.toggle('active', t === newIdx);
            }
            renderCards();
        }
    });

    // ===== 页面初始化 =====
    function init() {
        log('🚀 页面初始化开始');
        log('📱 UserAgent: ' + navigator.userAgent.substring(0, 50));
        
        checkSpeechSupport();
        
        var scoreEl = document.getElementById('score');
        if (scoreEl) scoreEl.textContent = score;
        
        renderCards();
        
        log('✅ 初始化完成');
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
    } else {
        init();
    }
</script>
