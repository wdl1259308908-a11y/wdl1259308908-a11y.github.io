    <ellipse cx="235" cy="329" rx="26" ry="22" fill="#FFFFFF"/>
    <ellipse cx="277" cy="329" rx="26" ry="22" fill="#FFFFFF"/>
    <path d="M256 316v12" fill="none" stroke="#5C4650" stroke-width="5" stroke-linecap="round"/>
    <path d="M229 333q27 42 54 0-4 45-27 45t-27-45z" fill="#6C3142" stroke="#5C4650" stroke-width="5" stroke-linejoin="round"/>
    <path d="M242 363q14-12 28 0-5 10-14 10t-14-10z" fill="#F486A3"/>
    <path d="M245 337h22v15q-11 8-22 0z" fill="#FFFFFF" stroke="#E5DEE2" stroke-width="2"/>

    <g fill="url(#leaf)" stroke="#568E43" stroke-width="3" stroke-linejoin="round">
      <path d="M296 360q1-55 20-68 15 24-5 70z"/>
      <path d="M305 364q25-51 49-54 1 30-33 60z"/>
      <path d="M286 360q-18-45-3-65 20 17 18 66z"/>
      <path d="M311 368q45-32 65-19-11 27-56 32z"/>
    </g>

    <path d="M164 445q55-92 136-91 15 11 9 29-29 71-130 99-28 7-15-37z" fill="url(#carrot)" stroke="#D95725" stroke-width="6" stroke-linejoin="round"/>
    <g fill="none" stroke="#D85F28" stroke-width="5" stroke-linecap="round" opacity="0.65">
      <path d="M211 414l22 7"/>
      <path d="M237 383l24 8"/>
      <path d="M188 441l20 6"/>
    </g>

    <ellipse cx="178" cy="396" rx="35" ry="46" transform="rotate(-24 178 396)" fill="url(#fur)" stroke="#E7E2E8" stroke-width="7"/>
    <ellipse cx="328" cy="397" rx="35" ry="46" transform="rotate(31 328 397)" fill="url(#fur)" stroke="#E7E2E8" stroke-width="7"/>
    <path d="M160 389q17 4 27 18M318 389q-8 15-5 29" fill="none" stroke="#DED8E1" stroke-width="4" stroke-linecap="round"/>
