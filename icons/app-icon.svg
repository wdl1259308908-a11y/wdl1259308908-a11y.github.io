<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title description">
  <title id="title">抱着胡萝卜的白兔成长伙伴</title>
  <desc id="description">一只粉色长耳朵、蓝色大眼睛的白兔，开心地抱着一根胡萝卜。</desc>

  <defs>
    <linearGradient id="fur" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.72" stop-color="#F8F4F1"/>
      <stop offset="1" stop-color="#E8E4EB"/>
    </linearGradient>
    <linearGradient id="ear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFB8C6"/>
      <stop offset="1" stop-color="#F58FA8"/>
    </linearGradient>
    <radialGradient id="iris" cx="35%" cy="28%" r="78%">
      <stop offset="0" stop-color="#76D7FF"/>
      <stop offset="0.55" stop-color="#2B9DDB"/>
      <stop offset="1" stop-color="#176094"/>
    </radialGradient>
    <linearGradient id="carrot" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFB348"/>
      <stop offset="0.55" stop-color="#FF7E32"/>
      <stop offset="1" stop-color="#E95822"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#62A84E"/>
      <stop offset="1" stop-color="#A9D86D"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#315979" flood-opacity="0.18"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <g stroke="#E7E2E8" stroke-width="8" stroke-linejoin="round">
      <path d="M189 190C136 158 104 79 133 38c16-23 45-13 61 8 30 40 37 103 28 151z" fill="url(#fur)"/>
      <path d="M323 190c53-32 85-111 56-152-16-23-45-13-61 8-30 40-37 103-28 151z" fill="url(#fur)"/>
    </g>
    <path d="M180 166c-28-29-49-84-32-110 8-11 20-3 28 8 20 28 28 69 27 110z" fill="url(#ear)" opacity="0.9"/>
    <path d="M332 166c28-29 49-84 32-110-8-11-20-3-28 8-20 28-28 69-27 110z" fill="url(#ear)" opacity="0.9"/>

    <ellipse cx="256" cy="390" rx="119" ry="105" fill="url(#fur)" stroke="#E7E2E8" stroke-width="7"/>
    <ellipse cx="185" cy="472" rx="57" ry="25" fill="url(#fur)" stroke="#E7E2E8" stroke-width="7"/>
    <ellipse cx="327" cy="472" rx="57" ry="25" fill="url(#fur)" stroke="#E7E2E8" stroke-width="7"/>
    <ellipse cx="256" cy="259" rx="145" ry="126" fill="url(#fur)" stroke="#E7E2E8" stroke-width="8"/>

    <ellipse cx="160" cy="310" rx="43" ry="17" fill="#FF9FB6" opacity="0.35" filter="url(#soft)"/>
    <ellipse cx="352" cy="310" rx="43" ry="17" fill="#FF9FB6" opacity="0.35" filter="url(#soft)"/>

    <g stroke="#4E4650" stroke-width="6">
      <ellipse cx="202" cy="252" rx="51" ry="63" fill="#FFFFFF"/>
      <ellipse cx="310" cy="252" rx="51" ry="63" fill="#FFFFFF"/>
    </g>
    <ellipse cx="208" cy="260" rx="35" ry="45" fill="url(#iris)"/>
    <ellipse cx="304" cy="260" rx="35" ry="45" fill="url(#iris)"/>
    <ellipse cx="211" cy="267" rx="22" ry="31" fill="#202331"/>
    <ellipse cx="301" cy="267" rx="22" ry="31" fill="#202331"/>
    <circle cx="221" cy="244" r="9" fill="#FFFFFF"/>
    <circle cx="311" cy="244" r="9" fill="#FFFFFF"/>
    <circle cx="200" cy="283" r="4" fill="#A9E5FF"/>
    <circle cx="290" cy="283" r="4" fill="#A9E5FF"/>

